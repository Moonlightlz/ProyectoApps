<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>📋 Mis Pedidos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mis Pedidos</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Historial de Pedidos</ion-card-title>
      <ion-card-subtitle>Revisa el estado de tus órdenes</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Aquí verás todos tus pedidos realizados y su estado actual.</p>
    </ion-card-content>
  </ion-card>
</ion-content>
