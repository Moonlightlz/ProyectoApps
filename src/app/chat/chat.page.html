<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>💬 Chat</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Chat</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Conversación con Atención al Cliente</ion-card-title>
      <ion-card-subtitle>Estamos aquí para ayudarte</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Envía mensajes y fotos para comunicarte con nuestro equipo.</p>
    </ion-card-content>
    <!-- La conversación se abrirá en una ventana/página separada. -->
  </ion-card>
</ion-content>
