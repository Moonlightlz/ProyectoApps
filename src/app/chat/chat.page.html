<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>💬 Chat</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Chat</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Conversación con Atención al Cliente</ion-card-title>
      <ion-card-subtitle>Estamos aquí para ayudarte</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Envía mensajes y fotos para comunicarte con nuestro equipo.</p>
    </ion-card-content>
      <!-- Botón visible sólo para el rol de usuario (diseño únicamente, sin funcionalidad) -->
      <ion-card-content class="chat-actions">
        <ion-button expand="block" color="primary" class="start-custom-order-btn" *ngIf="isUser">
          Iniciar Pedido Personalizado
        </ion-button>
      </ion-card-content>
  </ion-card>
</ion-content>
