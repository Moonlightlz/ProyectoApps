<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/orders"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <div class="header-title">
        <ion-icon name="receipt-outline"></ion-icon>
        <span>{{ orderCode || 'Chat del Pedido' }}</span>
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="chat-content">
  <!-- Información del pedido -->
  <ion-card *ngIf="order" class="order-info-card">
    <ion-card-content>
      <div class="order-info">
        <strong>Pedido:</strong> {{ order.orderCode }}<br>
        <strong>Cliente:</strong> {{ order.customerInfo.name }}<br>
        <strong>Total:</strong> S/ {{ order.total.toFixed(2) }}
      </div>
    </ion-card-content>
  </ion-card>

  <!-- Mensajes -->
  <div class="messages-container">
    <div *ngIf="messages.length === 0" class="no-messages">
      <p>No hay mensajes aún. ¡Inicia la conversación!</p>
    </div>

    <div *ngFor="let message of messages" 
         [ngClass]="{
           'message-wrapper': true,
           'my-message': isMyMessage(message),
           'other-message': !isMyMessage(message)
         }">
      <div class="message-bubble">
        <div class="message-header" *ngIf="!isMyMessage(message)">
          <strong>{{ message.senderName }}</strong>
          <ion-badge *ngIf="message.isAdmin" color="success">Pastelería Diego</ion-badge>
        </div>
        <div class="message-text">{{ message.message }}</div>
        <div class="message-time">{{ formatTime(message.timestamp) }}</div>
      </div>
    </div>
  </div>
</ion-content>

<!-- Input de mensaje -->
<ion-footer>
  <ion-toolbar>
    <div class="message-input">
      <ion-textarea
        [(ngModel)]="newMessage"
        placeholder="Escribe un mensaje..."
        rows="1"
        autoGrow="true"
        (keyup.enter)="sendMessage()"
      ></ion-textarea>
      <ion-button 
        (click)="sendMessage()" 
        [disabled]="!newMessage.trim()"
        fill="solid"
        color="primary">
        <ion-icon name="send-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
