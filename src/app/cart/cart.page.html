<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>🛒 Mi Carrito</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mi Carrito</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Productos Seleccionados</ion-card-title>
      <ion-card-subtitle>Revisa tu pedido antes de confirmar</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Aquí verás todos los productos que has agregado a tu carrito.</p>
    </ion-card-content>
  </ion-card>
</ion-content>
