<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>👤 Mi Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mi Perfil</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Información Personal</ion-card-title>
      <ion-card-subtitle>Gestiona tu cuenta y configuraciones</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Aquí puedes ver y editar tu información personal y configuraciones de la app.</p>
      
      <ion-button expand="block" color="danger" (click)="logout()">
        <ion-icon name="log-out" slot="start"></ion-icon>
        Cerrar Sesión
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
